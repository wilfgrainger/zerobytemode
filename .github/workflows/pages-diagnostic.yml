name: Diagnose GitHub Pages deployment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.head_ref == 'diagnose/pages-environment'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: pages-production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SITE_URL: 'https://zerobytemode.com'
      - run: |
          test -f out/index.html
          test -f out/CNAME
          grep -q 'Private by design' out/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4

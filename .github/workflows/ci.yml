name: Validate and deploy open local edition

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate browser application
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high

      - name: Validate repository architecture
        run: npm run repo:check

      - name: Check patch whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build static application
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: "https://zerobytemode.com"

      - name: Verify exact static artifact
        shell: bash
        run: |
          test -f out/index.html
          test -f out/CNAME
          test "$(cat out/CNAME)" = "zerobytemode.com"
          grep -q "No account" out/index.html
          grep -q "No paywall" out/index.html
          grep -q "All unlocked" out/index.html
          ! grep -Eqi "checkout|billing|magic link|stripe" out/index.html

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and codec tests against static output
        run: npm run test:browser

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-local-release-evidence
          path: |
            out
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 3

  pages:
    name: Publish GitHub Pages
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: pages-production
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build custom-domain release
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: "https://zerobytemode.com"

      - name: Verify root-domain paths and local-only product
        shell: bash
        run: |
          test -f out/index.html
          test -f out/CNAME
          test "$(cat out/CNAME)" = "zerobytemode.com"
          grep -q '/_next/' out/index.html
          grep -q '/icon.svg' out/index.html
          grep -q '/manifest.json' out/index.html
          ! grep -Eq '(href|src)="/zerobytemode/' out/index.html
          grep -q "No account" out/index.html
          grep -q "No paywall" out/index.html
          ! grep -Eqi "checkout|billing|magic link|stripe" out/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy ZeroByteMode

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Build and deploy frontend to Cloudflare
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_PUBLIC_WORKER_URL: "https://zerobytemode-subscriptions.zerobytemode.workers.dev"
          NEXT_PUBLIC_STRIPE_CHECKOUT_URL: "https://buy.stripe.com/aFaaEXceX2AG5Ut1176AM00"
          NEXT_PUBLIC_SITE_URL: "https://www.zerobytemode.com"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_51SalTfFJz3rreuQPYg1I1vbhdFscoNnCZHMyxVofYFc46lYADpPqENyhGDgAXF6ChirD1BPoKkjTDNWMG7WLbsBu00a6IxDuwM"
        run: npm run build

      - name: Deploy Frontend to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # Deploy Cloudflare Worker API
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c worker/wrangler.toml

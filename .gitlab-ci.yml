# Build a static Next.js export for GitLab Pages using a lean Alpine image
image: node:20-alpine

stages:
  - test
  - deploy

# Core Security Scans
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

pages:
  stage: deploy
  variables:
    NEXT_PUBLIC_WORKER_URL: "https://zerobytemode-subscriptions.zerobytemode.workers.dev"
    NEXT_PUBLIC_STRIPE_CHECKOUT_URL: "https://buy.stripe.com/aFaaEXceX2AG5Ut1176AM00"
    NEXT_PUBLIC_SITE_URL: "https://www.zerobytemode.com"
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_51SalTfFJz3rreuQPYg1I1vbhdFscoNnCZHMyxVofYFc46lYADpPqENyhGDgAXF6ChirD1BPoKkjTDNWMG7WLbsBu00a6IxDuwM"
  before_script:
    # Next.js requires libc6-compat for the SWC compiler to work on Alpine
    - apk add --no-cache libc6-compat
  script:
    - echo "Building ZeroByteMode Studio (Alpine Optimized)..."
    - npm ci
    - npm run build
    - rm -rf public_deploy
    - mkdir -p public_deploy
    - cp -r out/* public_deploy/
    - rm -rf public
    - mv public_deploy public
    - echo "Deployment complete."
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy the Cloudflare Worker (subscription API, auth, Stripe)
deploy_worker:
  stage: deploy
  script:
    - npm ci
    - npx wrangler deploy -c worker/wrangler.toml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - worker/**/*
